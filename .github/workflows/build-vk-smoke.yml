# Vulkan 冒烟测试 CI：Linux mingw 交叉编译 + Windows MSVC 编译双验证
# （与 build-gpu-probe.yml 同构；产物 vk_smoke.exe 供实机跑全链路 compute）
name: build-vk-smoke

on:
  push:
    paths:
      - 'tests/vk_smoke/**'
      - 'scripts/gen_spirv.py'
      - '.github/workflows/build-vk-smoke.yml'
  pull_request:
  workflow_dispatch:

jobs:
  mingw-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Build vk_smoke.exe
        run: bash tests/vk_smoke/build-mingw.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vk_smoke-mingw-x64
          path: tests/vk_smoke/vk_smoke.exe

  msvc-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build (MSVC, cl)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /W4 /utf-8 /Fe:vk-smoke-msvc.exe tests\vk_smoke\vk_smoke.c
      - uses: actions/upload-artifact@v4
        with:
          name: vk-smoke-msvc-x64
          path: vk-smoke-msvc.exe
