# 内核驱动 CI：windows-latest + WDK NuGet（微软官方方案）
# 产出：rokmd.sys / rokmd.pdb / rokmd.inf（Actions 产物下载）
name: build-kmd

on:
  push:
    paths:
      - 'kmd/**'
      - 'packages.config'
      - 'Directory.Build.props'
      - '.github/workflows/build-kmd.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build-kmd:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        # WDK 驱动工具链（WindowsApplicationForDrivers10.0）当前要求 VS2022 的
        # MSBuild；VS18 (2026) 下 Microsoft.Cpp.Redirect props 解析失败，
        # 因此显式锁定 17.x。
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WDK NuGet packages
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Build rokmd.sys (Release x64)
        run: msbuild kmd\rokmd.vcxproj /t:build /p:Configuration=Release /p:Platform=x64 /m /nologo /v:m

      - name: Build rokmd.sys (Debug x64, 带日志断言更友好)
        run: msbuild kmd\rokmd.vcxproj /t:build /p:Configuration=Debug /p:Platform=x64 /m /nologo /v:m

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rokmd-${{ github.sha }}
          if-no-files-found: error
          path: |
            kmd/**/rokmd.sys
            kmd/**/rokmd.pdb
            kmd/rokmd.inf
            kmd/**/rokmd.inf
