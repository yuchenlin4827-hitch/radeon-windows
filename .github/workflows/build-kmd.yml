# 内核驱动 CI：windows-2022 + WDK NuGet（微软官方方案）
# 产出：rokmd.sys / rokmd.pdb / rokmd.inf（Actions 产物下载）
# 打 tag（v*）：额外打包安装包 zip 并自动发布到 GitHub Releases
#
# 两个关键修正（踩坑记录）：
# 1) WDK NuGet 包内 props 的 WDKContentRoot 三层上溯推导有误，且会被后续
#    工具链导入覆盖 —— 用 msbuild 全局属性 /p:WDKContentRoot 传入（不可覆盖）。
# 2) StampInf 任务经 Tracker.exe 调 stampinf.exe 时依赖 PATH 解析（VSIX 场景
#    WDK bin 在 PATH 里，NuGet 场景没有）—— 构建前把 WDK bin 目录前置到 PATH。
# 3) 安装包测试签名链（2026-11-09）：构建期生成一次性自签代码签名证书，
#    signtool 给 sys 嵌签，inf2cat 生成 rokmd.cat 后再签 cat，公钥 .cer 随包分发。
#    v0.2.3 前的包缺 cat/证书 → 实机 pnputil 报 "does not contain digital
#    signature information"，本步修复。另：发布 INF 统一取 stampinf 展开后
#    产物（源文件含 NT$ARCH$，未展开无法绑定设备）并规范化 UTF-16LE
#    （inf2cat 只认 ANSI/UTF-16LE）。
name: build-kmd

on:
  push:
    branches:
      - main
    paths:
      - 'kmd/**'
      - 'packages.config'
      - 'Directory.Build.props'
      - '.github/workflows/build-kmd.yml'
      - 'docs/INSTALL.txt'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# 发 Release 需要 GITHUB_TOKEN 写 contents 权限
permissions:
  contents: write

jobs:
  build-kmd:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        # WDK 驱动工具链（WindowsApplicationForDrivers10.0）当前要求 VS2022 的
        # MSBuild；VS18 (2026) 下 Microsoft.Cpp.Redirect props 解析失败，
        # 因此显式锁定 17.x。
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WDK NuGet packages
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Build rokmd.sys (Release x64)
        shell: pwsh
        run: |
          $wdkRoot = "$env:GITHUB_WORKSPACE\packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\c\"
          if (-not (Test-Path "${wdkRoot}bin\10.0.26100.0\x64\stampinf.exe")) { Write-Error "WDK layout mismatch: stampinf not under $wdkRoot" }
          $env:Path = "${wdkRoot}bin\10.0.26100.0\x64;$env:Path"
          msbuild kmd\rokmd.vcxproj /t:build /p:Configuration=Release /p:Platform=x64 /p:WDKContentRoot="$wdkRoot" /m /nologo /v:m

      - name: Build rokmd.sys (Debug x64, 带日志断言更友好)
        shell: pwsh
        run: |
          $wdkRoot = "$env:GITHUB_WORKSPACE\packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\c\"
          $env:Path = "${wdkRoot}bin\10.0.26100.0\x64;$env:Path"
          msbuild kmd\rokmd.vcxproj /t:build /p:Configuration=Debug /p:Platform=x64 /p:WDKContentRoot="$wdkRoot" /m /nologo /v:m

      - name: Test-sign package（自签证书 + inf2cat + signtool；PR/推送/打 tag 全量执行）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # ---- 工具定位：WDK NuGet 的 inf2cat（与 stampinf 同目录）+ Windows SDK 的 signtool ----
          $wdkRoot = "$env:GITHUB_WORKSPACE\packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\c\"
          $wdkBin  = "${wdkRoot}bin\10.0.26100.0\x64"
          if (-not (Test-Path "$wdkBin\inf2cat.exe")) { Write-Error "inf2cat.exe not found under $wdkBin" }
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match '\\x64\\' } |
                      Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found under Windows Kits" }
          Write-Host "inf2cat : $wdkBin\inf2cat.exe"
          Write-Host "signtool: $($signtool.FullName)"

          # ---- 一次性自签代码签名证书（公钥 .cer 随包分发；导入 Root+TrustedPublisher 后本机可信）----
          $cn   = 'Radeon Open KMD Test Signing'
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=$cn" `
                    -CertStoreLocation Cert:\CurrentUser\My -KeySpec Signature -KeyUsage DigitalSignature `
                    -KeyAlgorithm RSA -KeyLength 2048 -NotAfter (Get-Date).AddYears(10)
          New-Item -ItemType Directory -Force -Path signing | Out-Null
          Export-Certificate -Cert $cert -FilePath signing\rokmd-testsigning.cer | Out-Null
          Write-Host "test cert: $($cert.Thumbprint) (CN=$cn, NotAfter=$($cert.NotAfter))"

          # ---- sys 嵌入签名（双保险：脱离 catalog 的设备管理器直装路径也能过）----
          $sys = Get-ChildItem -Recurse -Filter rokmd.sys | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $sys) { Write-Error "rokmd.sys (Release) not found" }
          & $signtool.FullName sign /fd sha256 /q /n "$cn" $sys.FullName
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign rokmd.sys failed" }

          # ---- INF 取 stampinf 展开后产物（源文件含 NT$ARCH$，未展开无法绑定设备），
          #      规范化 UTF-16LE + CRLF（inf2cat 不接受 UTF-8）----
          New-Item -ItemType Directory -Force -Path signing\pkg | Out-Null
          $infProd = Get-ChildItem -Recurse -Filter rokmd.inf | Where-Object { $_.FullName -match '\\Release\\' } | Select-Object -First 1
          if (-not $infProd) { Write-Warning "no stamped INF under Release, falling back to source INF"; $infProd = Get-Item kmd\rokmd.inf }
          $infText = Get-Content $infProd.FullName -Raw
          if ($infText -match '\$ARCH\$|\$WINVER\$') { Write-Error "INF not stampinf-expanded ($($infProd.FullName))" }
          $infText = $infText.Replace("`r`n", "`n").Replace("`n", "`r`n")
          [IO.File]::WriteAllText("signing\pkg\rokmd.inf", $infText, [Text.Encoding]::Unicode)
          Copy-Item $sys.FullName signing\pkg\rokmd.sys

          # ---- 目录签名 ----
          & "$wdkBin\inf2cat.exe" /driver:signing\pkg /os:10_X64
          if ($LASTEXITCODE -ne 0) { Write-Error "inf2cat failed" }
          & $signtool.FullName sign /fd sha256 /q /n "$cn" signing\pkg\rokmd.cat
          if ($LASTEXITCODE -ne 0) { Write-Error "signtool sign rokmd.cat failed" }
          Write-Host '== cat signature info (NotTrusted expected on runner; trust comes from importing .cer on the target machine) =='
          Get-AuthenticodeSignature signing\pkg\rokmd.cat | Format-List Status, StatusMessage, SignerCertificate

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rokmd-${{ github.sha }}
          if-no-files-found: error
          path: |
            kmd/**/rokmd.sys
            kmd/**/rokmd.pdb
            kmd/rokmd.inf
            kmd/**/rokmd.inf

      # ---- 以下仅 tag（v*）触发：打包安装包并发布 GitHub Release ----
      - name: Build gpu_probe.exe (MSVC x64, tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /W4 /utf-8 /I kmd\src /DROK_PROBE_HAS_ESCAPE_ABI=1 /Fe:gpu_probe.exe tests\gpu_probe\gpu_probe.c /link gdi32.lib setupapi.lib cfgmgr32.lib user32.lib advapi32.lib

      - name: Package installer（PR/push → artifact；tag → Release zip）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $isTag = "${{ github.ref }}" -like 'refs/tags/*'
          New-Item -ItemType Directory -Force -Path "package\bin","package\tools" | Out-Null
          $sys = Get-ChildItem -Recurse -Filter rokmd.sys | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          $pdb = Get-ChildItem -Recurse -Filter rokmd.pdb | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $sys) { throw "rokmd.sys (Release) not found" }
          Copy-Item $sys.FullName "package\bin\rokmd.sys"
          if ($pdb) { Copy-Item $pdb.FullName "package\bin\rokmd.pdb" }
          Copy-Item signing\pkg\rokmd.inf package\          # stampinf 展开 + UTF-16LE，与 cat 覆盖同一字节
          if (Test-Path gpu_probe.exe) { Copy-Item gpu_probe.exe package\tools\ }
          Copy-Item docs\INSTALL.txt package\
          Copy-Item LICENSE package\
          Copy-Item signing\pkg\rokmd.cat package\          # 目录签名
          Copy-Item signing\rokmd-testsigning.cer package\ # 测试证书公钥
          Copy-Item tools\install-rokmd.ps1 package\tools\
          if ($isTag) { $zip = "radeon-open-kmd-${{ github.ref_name }}-x64.zip" }
          else        { $zip = "radeon-open-kmd-signed-${{ github.sha }}.zip" }
          Compress-Archive -Path package\* -DestinationPath $zip
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Packaged: $zip"

      - name: Upload signed package artifact（非 tag 构建可直接下载安装）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: rokmd-signed-package-${{ github.sha }}
          if-no-files-found: error
          path: radeon-open-kmd-signed-*.zip

      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Radeon Open KMD ${{ github.ref_name }}
          files: ${{ env.ZIP_PATH }}
          body: |
            **Radeon Open KMD 安装包（Alpha）** — 把 Linux radeon 开源栈移植到 Windows WDDM 的实验版。

            ## 安装（管理员 PowerShell；测试签名三前提）
            1. UEFI 关闭 Secure Boot；Windows 安全中心 → 设备安全性 → 内核隔离 → 内存完整性 = 关
            2. 管理员运行 `bcdedit /set testsigning on` 并重启（桌面右下角出现「测试模式」水印）
            3. 解压后运行 `tools\install-rokmd.ps1`（自动导入随包测试证书 → pnputil 安装）
               手动等价：`Import-Certificate` 到 LocalMachine\Root 与 TrustedPublisher，
               再 `pnputil /add-driver rokmd.inf /install`
            4. 运行 `tools\gpu_probe.exe` 确认显卡 PCI ID 在支持表内；详见包内 `INSTALL.txt`

            ## 近期更新（M3.4a）
            - 安装包附带已签名 rokmd.cat + 测试证书 rokmd-testsigning.cer + 一键安装脚本
              （修复实机 pnputil "does not contain digital signature information"）
            - CP 微码内嵌（linux-firmware CAICOS PFP 1120 + ME 1376 dwords）
            - Evergreen CP ring 初始化序列（GRBM 软复位 + CP_RB_* + ME_INIT + ring test），
              **默认关闭**：`<驱动键>\Parameters\EnableRing = 1` 显式开启（零 TDR 风险）
            - escape v1 新增 `QUERY_HW_STATUS (type 10)`：只读寄存器/CP 状态快照，
              gpu_probe [1.7]（PCI 资源）与 [4.9]（硬件状态）配合观测
            - PM4 解码器 count 语义修正（对照内核 r600_cs.c：包总长 = count+2）

            ## 支持硬件（AMD TeraScale，VEN_1002）
            | 代际 | 系列 | 设备 ID |
            |---|---|---|
            | Seymour/Caicos | **HD 6490M（0x6768）/ HD 7470M（0x6778）** 及 HD 6400M-7400M 全系 | 0x6760-0x677B |
            | Sumo/SuperSumo | Llano APU 内显（HD 6520G/6480G 等） | 0x9640-0x964F |
            | TeraScale 1-3 全家族 | HD 2000-4000 / HD 5000 / HD 6000-7000 / Trinity APU | 300+ 设备 ID（见 rokmd.inf） |

            ## 当前状态（M3.4a）
            - WDDM 2.0 (0x5023) 全量 DDI 表 + escape 通道 v1（10 类查询）+ 模拟设备后端
            - CP ring：初始化/观测路径就绪（主机端 176 项单测覆盖演练序列）；真实提交在 M3.4b
            - ⚠️ 未经 WHQL 认证，仅供实验环境；安装需测试签名模式
            - ⚠️ render-only 驱动接管唯一显示 GPU ≈ 无头风险，先读包内 INSTALL.txt 与 docs/bringup-safety.md
