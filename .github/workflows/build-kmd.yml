# 内核驱动 CI：windows-2022 + WDK NuGet（微软官方方案）
# 产出：rokmd.sys / rokmd.pdb / rokmd.inf（Actions 产物下载）
# 打 tag（v*）：额外打包安装包 zip 并自动发布到 GitHub Releases
#
# 两个关键修正（踩坑记录）：
# 1) WDK NuGet 包内 props 的 WDKContentRoot 三层上溯推导有误，且会被后续
#    工具链导入覆盖 —— 用 msbuild 全局属性 /p:WDKContentRoot 传入（不可覆盖）。
# 2) StampInf 任务经 Tracker.exe 调 stampinf.exe 时依赖 PATH 解析（VSIX 场景
#    WDK bin 在 PATH 里，NuGet 场景没有）—— 构建前把 WDK bin 目录前置到 PATH。
name: build-kmd

on:
  push:
    branches:
      - main
    paths:
      - 'kmd/**'
      - 'packages.config'
      - 'Directory.Build.props'
      - '.github/workflows/build-kmd.yml'
      - 'docs/INSTALL.txt'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# 发 Release 需要 GITHUB_TOKEN 写 contents 权限
permissions:
  contents: write

jobs:
  build-kmd:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        # WDK 驱动工具链（WindowsApplicationForDrivers10.0）当前要求 VS2022 的
        # MSBuild；VS18 (2026) 下 Microsoft.Cpp.Redirect props 解析失败，
        # 因此显式锁定 17.x。
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore WDK NuGet packages
        run: nuget restore .\packages.config -PackagesDirectory .\packages\

      - name: Build rokmd.sys (Release x64)
        shell: pwsh
        run: |
          $wdkRoot = "$env:GITHUB_WORKSPACE\packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\c\"
          if (-not (Test-Path "${wdkRoot}bin\10.0.26100.0\x64\stampinf.exe")) { Write-Error "WDK layout mismatch: stampinf not under $wdkRoot" }
          $env:Path = "${wdkRoot}bin\10.0.26100.0\x64;$env:Path"
          msbuild kmd\rokmd.vcxproj /t:build /p:Configuration=Release /p:Platform=x64 /p:WDKContentRoot="$wdkRoot" /m /nologo /v:m

      - name: Build rokmd.sys (Debug x64, 带日志断言更友好)
        shell: pwsh
        run: |
          $wdkRoot = "$env:GITHUB_WORKSPACE\packages\Microsoft.Windows.WDK.x64.10.0.26100.2454\c\"
          $env:Path = "${wdkRoot}bin\10.0.26100.0\x64;$env:Path"
          msbuild kmd\rokmd.vcxproj /t:build /p:Configuration=Debug /p:Platform=x64 /p:WDKContentRoot="$wdkRoot" /m /nologo /v:m

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rokmd-${{ github.sha }}
          if-no-files-found: error
          path: |
            kmd/**/rokmd.sys
            kmd/**/rokmd.pdb
            kmd/rokmd.inf
            kmd/**/rokmd.inf

      # ---- 以下仅 tag（v*）触发：打包安装包并发布 GitHub Release ----
      - name: Build gpu_probe.exe (MSVC x64, tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -version "[17.0,18.0)" -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /O2 /W4 /utf-8 /I kmd\src /DROK_PROBE_HAS_ESCAPE_ABI=1 /Fe:gpu_probe.exe tests\gpu_probe\gpu_probe.c /link gdi32.lib setupapi.lib cfgmgr32.lib user32.lib advapi32.lib

      # ---- 打包布局（扁平化：rokmd.inf/rokmd.sys/rokmd.cat 必须同目录，
      #      DriverStore 导入按 SourceDisksFiles 相对 INF 的路径解析文件）----
      - name: Package layout (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "package\tools","pkgdrv" | Out-Null
          $sys = Get-ChildItem -Recurse -Filter rokmd.sys | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          $pdb = Get-ChildItem -Recurse -Filter rokmd.pdb | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $sys) { throw "rokmd.sys (Release) not found" }
          # INF 取构建产物里 stampinf 处理过的版本（NT$ARCH$ 已展开为 NTamd64）；
          # 找不到时回退仓库 INF，手动展开并转 UTF-16LE（inf2cat 最稳的编码）
          $inf = Get-ChildItem -Recurse -Filter rokmd.inf | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if ($inf) {
            Copy-Item $inf.FullName pkgdrv\rokmd.inf
            if ((Get-Content pkgdrv\rokmd.inf -Raw) -match '\$ARCH\$') {
              Write-Warning 'stamped INF 仍含 $ARCH$，手动展开'
              $t = (Get-Content pkgdrv\rokmd.inf -Raw) -replace 'NT\$ARCH\$','NTamd64'
              [IO.File]::WriteAllText("$PWD\pkgdrv\rokmd.inf", $t, [Text.Encoding]::Unicode)
            }
          } else {
            Write-Warning '未找到 stampinf 产物 INF，回退仓库 INF（展开 $ARCH$，转 UTF-16LE）'
            $t = (Get-Content kmd\rokmd.inf -Raw) -replace 'NT\$ARCH\$','NTamd64'
            [IO.File]::WriteAllText("$PWD\pkgdrv\rokmd.inf", $t, [Text.Encoding]::Unicode)
          }
          Copy-Item $sys.FullName pkgdrv\rokmd.sys
          # pkgdrv = 干净编目目录（仅 inf+sys，给 inf2cat）
          Copy-Item pkgdrv\rokmd.inf package\
          Copy-Item pkgdrv\rokmd.sys package\
          Copy-Item gpu_probe.exe package\tools\
          if ($pdb) { Copy-Item $pdb.FullName package\tools\rokmd.pdb }
          Copy-Item tools\win\install.ps1   package\tools\
          Copy-Item tools\win\uninstall.ps1 package\tools\
          Copy-Item tools\win\install.cmd   package\
          Copy-Item tools\win\uninstall.cmd package\
          Copy-Item docs\INSTALL.txt package\
          Copy-Item LICENSE package\
          Write-Host "package layout ready (flat: inf/sys/cat 同目录)"

      # ---- 测试签名：自签 CodeSigning 证书 -> 签 sys -> inf2cat -> 签 cat ----
      # 解决实机反馈：pnputil "The third-party INF does not contain digital
      # signature information"（包内无目录文件/未签名）。每次构建证书独立生成，
      # 公钥随包发布（rokmd.cer），用户导入 Root/TrustedPublisher 后在
      # testsigning 模式下即可加载。
      - name: Test-sign driver package (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
                        Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -Last 1 -ExpandProperty FullName
          }
          $inf2cat = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter inf2cat.exe |
                     Where-Object { $_.FullName -match '\\x86\\|\\x64\\' } | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw 'signtool not found' }
          if (-not $inf2cat)  { throw 'inf2cat not found' }
          Write-Host "signtool = $signtool"
          Write-Host "inf2cat  = $inf2cat"
          # 1) 自签 CodeSigning 证书
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=radeon-open-kmd-test,O=radeon-windows,C=TW' -CertStoreLocation Cert:\CurrentUser\My -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddYears(15)
          $pw  = ConvertTo-SecureString 'rok-test-sign' -AsPlainText -Force
          $pfx = Join-Path $env:TEMP 'rok-sign.pfx'
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $pw | Out-Null
          # 2) 先签 sys（目录文件对 PE 做页哈希，内嵌签名区不参与；先签再编目是 WDK 推荐顺序）
          & $signtool sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com /f $pfx /p rok-test-sign pkgdrv\rokmd.sys
          if ($LASTEXITCODE -ne 0) { throw 'signtool sign rokmd.sys failed' }
          # 3) inf2cat 生成 rokmd.cat（10_X64 覆盖 Win10/11 x64）
          & $inf2cat /driver:pkgdrv /os:10_X64 /uselocaltime
          if ($LASTEXITCODE -ne 0) { throw 'inf2cat failed' }
          # 4) 签 cat 并导出公钥
          & $signtool sign /fd sha256 /td sha256 /tr http://timestamp.digicert.com /f $pfx /p rok-test-sign pkgdrv\rokmd.cat
          if ($LASTEXITCODE -ne 0) { throw 'signtool sign rokmd.cat failed' }
          Copy-Item pkgdrv\rokmd.cat package\
          Export-Certificate -Cert $cert -FilePath package\rokmd.cer | Out-Null
          Get-ChildItem package -Recurse | ForEach-Object { Write-Host $_.FullName }

      - name: Zip package (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = "radeon-open-kmd-${{ github.ref_name }}-x64.zip"
          Compress-Archive -Path package\* -DestinationPath $zip
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Packaged: $zip"

      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Radeon Open KMD ${{ github.ref_name }}
          files: ${{ env.ZIP_PATH }}
          body: |
            **Radeon Open KMD 安装包（Alpha）** — 把 Linux radeon 开源栈移植到 Windows WDDM 的实验版。

            ## 安装（管理员权限）— v0.2.4 起驱动包已测试签名
            1. 解压后右键 `install.cmd` → 以管理员身份运行：自动导入包内测试证书
               （rokmd.cer → 受信任的根 + 受信任的发布者）、启用 testsigning
               （首次启用需重启后再跑一遍）、pnputil 安装驱动包。
               前提：BIOS 关闭 Secure Boot；关闭内核隔离/内存完整性（HVCI）。
            2. 绑定设备（Windows 不会自动用本驱动替换官方 AMD 驱动，属预期）：
               设备管理器 → 显示适配器 → 你的 AMD 卡 → 更新驱动程序 →
               浏览我的电脑 → 让我从可用驱动列表中选取 → 从磁盘安装 → 选 rokmd.inf
            3. 观测：`tools\gpu_probe.exe`（[1.7] PCI 资源 / [4.x] escape 快照）
            4. 卸载：`uninstall.cmd`；详见包内 `INSTALL.txt`

            ## 本版新增（v0.2.4-alpha，签名化）
            - **修复实机 `pnputil` 报错** "The third-party INF does not contain digital
              signature information"：inf2cat 生成 rokmd.cat + 测试证书自签
              （sys 内嵌 Authenticode + cat 双签名），pnputil 可正常导入驱动包
            - 一键安装/卸载脚本（install.cmd / uninstall.cmd）：证书导入、
              testsigning 检查、HVCI 检测、pnputil 全自动
            - 安装包布局扁平化（rokmd.inf/rokmd.sys/rokmd.cat 同目录），
              满足 DriverStore 导入对 SourceDisksFiles 相对路径的要求
            - INF 改用构建产物 stampinf 展开版（NTamd64 装饰段正确落盘）

            ## 支持硬件（AMD TeraScale，VEN_1002）
            | 代际 | 系列 | 设备 ID |
            |---|---|---|
            | Seymour/Caicos | **HD 6490M（0x6768）/ HD 7470M（0x6760/0x6778）** 及 HD 6400M-7400M 全系 | 0x6760-0x677B |
            | Sumo/SuperSumo | Llano APU 内显（HD 6520G/6480G 等） | 0x9640-0x964F |
            | TeraScale 1-3 全家族 | HD 2000-4000 / HD 5000 / HD 6000-7000 / Trinity APU | 300+ 设备 ID（见 rokmd.inf） |

            ## 当前状态（M3.4a）
            - WDDM 2.0 (0x5023) 全量 DDI 表 + escape 通道 v1（10 类查询）+ 模拟设备后端
            - CP ring：初始化/观测路径就绪（主机端 176 项单测覆盖演练序列）；真实提交在 M3.4b
            - ⚠️ 未经 WHQL 认证，仅供实验环境；采用"测试证书 + testsigning"方案（install.cmd 自动处理）
            - ⚠️ render-only 驱动接管唯一显示 GPU ≈ 无头风险，先读包内 INSTALL.txt 与 docs/bringup-safety.md
